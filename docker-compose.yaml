services:
  live-poll:
    build:
      context: .
      dockerfile: Dockerfile
    image: live-poll:local
    container_name: live-poll
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      # PUBLIC_URL: http://localhost:3000
      TRUST_PROXY: "false"
    ports:
      - "3000:3000"
    # Läuft mit der UID des Host-Users, damit ./data beschreibbar ist.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # Bind-Mount: feedback.sqlite überlebt Rebuilds und auch `docker compose down -v`.
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
