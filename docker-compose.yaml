services:
  live-poll:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Hinter Traefik (Coolify) true lassen, damit X-Forwarded-For ausgewertet wird.
      TRUST_PROXY: ${TRUST_PROXY:-true}
    # Kein Host-Port: Coolify routet über Traefik. Lokal öffnet docker-compose.override.yaml den Port.
    expose:
      - "3000"
    volumes:
      - live-poll-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  live-poll-data:
